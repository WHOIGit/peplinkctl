[project]
name = "peplinkctl"
version = "0.2.0"
description = "Peplink Router API"
authors = [
    {name = "Ryan Govostes", email = "rgovostes@whoi.edu"}
]
requires-python = ">=3.8"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
ros = []  # TODO

[project.scripts]
peplinkctl = "peplinkctl.__main__:main"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/peplinkctl"]
